server:
  port: 8099

spring:
  application:
    name: monk-backend

  datasource:
    #    url: jdbc:mysql://localhost:3306/monk_task_db?useSSL=false&allowPublicKeyRetrieval=true
    url: jdbc:h2:mem:coupons;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    #    driver-class-name: com.mysql.cj.jdbc.Driver
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
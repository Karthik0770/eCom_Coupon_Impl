server:
  port: 8099

spring:
  application:
    name: monk-backend
  datasource:
    url: jdbc:mysql://localhost:3306/monk_task_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true